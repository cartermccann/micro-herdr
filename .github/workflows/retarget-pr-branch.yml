name: retarget-pr-branch

on:
  push:
    branches: [feat/hyprland-appid-rebased-5450]
    paths:
      - ".github/workflows/retarget-pr-branch.yml"

permissions:
  contents: write

jobs:
  retarget:
    runs-on: ubuntu-latest
    steps:
      - name: Point feat/hyprland-appid-aliases-5450 at identity-on-main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/cartermccann/micro-herdr.git"
          git fetch --depth=1 origin 0101a0531f58da4c2d44069d0af337238559452a
          git push --force origin 0101a0531f58da4c2d44069d0af337238559452a:refs/heads/feat/hyprland-appid-aliases-5450
